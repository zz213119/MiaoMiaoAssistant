plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.u7e5f3218e9'
    compileSdk 34

    signingConfigs {
        debug {
            // 固定签名：默认debug构建每次CI运行都会在ubuntu-latest的临时环境里
            // 现生成一个新的~/.android/debug.keystore，导致每次编译出的APK
            // 签名都不一样，装新版前必须先卸载旧版。这里改成引用仓库里
            // 提交的固定debug.keystore，让每次CI编译签名保持一致，
            // 后续版本就能直接覆盖安装，不用再卸载重装。
            storeFile rootProject.file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    defaultConfig {
        applicationId "com.example.u7e5f3218e9"
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // 该工程仅使用原生 Android 框架 API，无第三方依赖
}